name: Build Sphere Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o SphereBoxAndroid_Project.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        id: locate
        run: |
          FILE=$(find project -name gradlew -type f | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle wrapper not found."
            echo "The project ZIP must contain an Android Gradle project."
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SphereBox-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
